spring.application.name=movimentos
server.port=8080

# ---------------------------------------------------------------
# H2 em memoria (modo compativel com SQL Server, igual ao diagrama)
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:movimentosdb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console do H2: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:movimentosdb  | usuario: sa | senha: (vazia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------
# Estrutura criada pelo schema.sql (tipos exatos do enunciado)
# O Hibernate NAO gera tabelas; so valida o mapeamento
# ---------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Log do SQL gerado (util para depurar; desligar se poluir o console)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------------------------------------------------------
# CORS: origem do front Angular (ng serve)
# ---------------------------------------------------------------
app.cors.allowed-origins=http://localhost:4200
